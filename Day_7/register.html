<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-5 mb-5">
  <h2 class="mb-4">Student Registration Form</h2>

  <form action="process.php" method="POST" enctype="multipart/form-data">

    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
    </div>

    <div class="mb-3">
      <label for="branch" class="form-label">Branch</label>
      <input type="text" class="form-control" id="branch" name="branch" placeholder="e.g. CSE, ECE">
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input type="text" class="form-control" id="phone" name="phone" placeholder="10-digit phone number">
    </div>

    <div class="mb-3">
      <label class="form-label d-block">Gender</label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Male">
        <label class="form-check-label" for="genderMale">Male</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Female">
        <label class="form-check-label" for="genderFemale">Female</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="genderOther" value="Other">
        <label class="form-check-label" for="genderOther">Other</label>
      </div>
    </div>

    <div class="mb-3">
      <label for="course" class="form-label">Course</label>
      <select class="form-select" id="course" name="course">
        <option value="" selected disabled>-- Select a course --</option>
        <option value="B.Tech CSE">B.Tech CSE</option>
        <option value="B.Tech ECE">B.Tech ECE</option>
        <option value="B.Tech ME">B.Tech ME</option>
        <option value="B.Tech CE">B.Tech CE</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter your full address"></textarea>
    </div>

    <div class="mb-3">
      <label for="photo" class="form-label">Profile Photo</label>
      <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
      <div class="form-text">Front-end only for now, no backend upload processing yet.</div>
      <img id="photoPreview" src="" alt="" class="mt-2 d-none">
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
