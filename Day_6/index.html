<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Posts Directory</title>

  <!-- Bootstrap CSS (for the card grid) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Our own custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container py-4">
    <h1 class="mb-4">Posts</h1>

    <!-- Shown while data is being fetched -->
    <div id="loading" class="text-center">
      <p>Loading posts...</p>
    </div>

    <!-- Shown only if the fetch fails -->
    <div id="error" class="alert alert-danger d-none"></div>

    <!-- Cards get inserted here by JavaScript -->
    <div id="card-container" class="row g-3"></div>
  </div>

  <!-- Our JS runs after the HTML above exists -->
  <script src="script.js"></script>
</body>
</html>
