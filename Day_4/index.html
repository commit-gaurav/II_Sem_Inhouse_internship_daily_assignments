<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toggle theme and Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
    <div class="logo">My Page</div>
    <button id="themeToggle" onclick="toggleTheme()">🌙 Dark mode</button>
  </nav>


<div class="center">
    <div class="counter-box">
        <div class="counter-label">Click count</div>
        <div id="counterValue">0</div>  
        <div class="counter-actions">
            <button id="incrementBtn">+ Click me</button>
            <button id="resetBtn" class="reset">Reset</button>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
